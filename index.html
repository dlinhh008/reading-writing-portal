        const speakWord = (text, e) => {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            const cleanWord = text.trim();
            if (!cleanWord) return;

            const fallbackTTS = () => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.resume();
                    const utterance = new SpeechSynthesisUtterance(cleanWord);
                    utterance.lang = 'en-US';
                    utterance.rate = 0.9;
                    window.speechSynthesis.speak(utterance);
                }
            };

            let audioEl = document.getElementById('portal-tts-audio');
            if (!audioEl) {
                audioEl = document.createElement('audio');
                audioEl.id = 'portal-tts-audio';
                document.body.appendChild(audioEl);
            }

            audioEl.onerror = fallbackTTS;
            audioEl.src = `https://api.dictionaryapi.dev/media/pronunciations/en/${encodeURIComponent(cleanWord.toLowerCase())}-uk.mp3`;

            const playPromise = audioEl.play();
            if (playPromise !== undefined) {
                playPromise.catch(fallbackTTS);
            }
        };

                    (doc) => {
                        if (doc.exists) {
                            const cloudData = doc.data();
                            setData({
                                ...DEFAULT_DATA,
                                ...cloudData,
                                users: (cloudData.users && cloudData.users.length > 0) ? cloudData.users : DEFAULT_DATA.users,
                                tests: (cloudData.tests && cloudData.tests.length > 0) ? cloudData.tests : DEFAULT_DATA.tests,
                                listeningTests: cloudData.listeningTests || [],
                                listeningScores: cloudData.listeningScores || [],
                                writingTests: (cloudData.writingTests && cloudData.writingTests.length > 0) ? cloudData.writingTests : DEFAULT_WRITING_TESTS,
                                scores: cloudData.scores || [],
                                writingSubmissions: cloudData.writingSubmissions || [],
                                userVocab: cloudData.userVocab || {}
                            });
                            setDbError(null);
                        } else {
                            setData(DEFAULT_DATA);
                            setDbError(null);
                        }
                    },
                    (error) => {
                        console.error("Firebase Error:", error);
                        setDbError("Lỗi kết nối CSDL (Permission Denied).");
                    }
                );
                return () => unsubscribe();
            }, []);

            const saveData = (newData) => {
                setData(newData);
                db.collection('portal_data').doc('main_database').set(newData, { merge: true }).catch(err => {
                    console.error("Cloud Save Error:", err);
                    alert("Error saving to cloud! Check internet connection.");
                });
            };

            const handleSaveVocabToNotebook = (wordObj, sourceTitle = '') => {
                if (!currentUser) return;
                const username = currentUser.username;
                const currentList = (data.userVocab && data.userVocab[username]) ? data.userVocab[username] : [];
                const exists = currentList.some(item => item.w.toLowerCase() === wordObj.w.toLowerCase());
                if (exists) return;

                const newEntry = {
                    w: wordObj.w,
                    m: wordObj.m,
                    example: wordObj.example || '',
                    source: sourceTitle,
                    savedAt: new Date().toISOString()
                };

                const updatedUserVocab = {
                    ...(data.userVocab || {}),
                    [username]: [newEntry, ...currentList]
                };
                saveData({ ...data, userVocab: updatedUserVocab });
            };

            const handleRemoveVocabFromNotebook = (wordText) => {
                if (!currentUser) return;
                const username = currentUser.username;
                const currentList = (data.userVocab && data.userVocab[username]) ? data.userVocab[username] : [];
                const updatedList = currentList.filter(item => item.w.toLowerCase() !== wordText.toLowerCase());
                saveData({
                    ...data,
                    userVocab: {
                        ...(data.userVocab || {}),
                        [username]: updatedList
                    }
                });
            };

                setReviewSubmission(null);
                setActiveWritingTest(null);
                setReviewWritingSub(null);
            };

            const startWritingSession = (wTest, selectedTime) => {
                setTimeLimit(selectedTime);
                setActiveWritingTest(wTest);
                setReviewWritingSub(null);
                setActiveTest(null);
                setReviewSubmission(null);
                setActiveListeningTest(null);
                setReviewListeningSub(null);
            };

            const resetToDashboard = () => {
                setActiveTest(null);
                setReviewSubmission(null);
                setActiveListeningTest(null);
                setReviewListeningSub(null);
                setActiveWritingTest(null);
                setReviewWritingSub(null);
                setTimeLimit(0);
            };

            const handleLoginSuccess = (user) => {
                localStorage.setItem('portal_user', JSON.stringify(user));
                setCurrentUser(user);
            };

            const handleLogout = () => {
                localStorage.removeItem('portal_user');
                setCurrentUser(null);
                resetToDashboard();
            };

            if (dbError) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-xl border-t-4 border-red-500 text-center max-w-xl">
                            <h2 className="text-2xl font-bold text-slate-800 mb-3">⚠️ Database Connection Error</h2>
                            <p className="text-slate-600">{dbError}</p>
                        </div>
                    </div>
                );
            }

            if (!data) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50">
                    <div className="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-4"></div>
                    <p className="font-semibold text-slate-500 tracking-wide">Connecting to Secure Cloud...</p>
                </div>
            );

            if (!currentUser) return <Login data={data} onLogin={handleLoginSuccess} />;
            
            const isInsideWorkspace = activeTest || reviewSubmission || activeListeningTest || reviewListeningSub || activeWritingTest || reviewWritingSub;
            const currentUserVocabList = (data.userVocab && data.userVocab[currentUser.username]) ? data.userVocab[currentUser.username] : [];

            return (
                <div className="h-screen flex flex-col bg-slate-50 font-sans">
                    <header className="bg-slate-900 text-slate-50 px-6 py-4 flex justify-between items-center shadow-lg z-20 border-b border-slate-800">
                        <div className="flex items-center gap-6">
                            <div className="flex items-center gap-3">
                                <span className="text-2xl">🎓</span>
                                <h1 className="text-xl font-bold tracking-tight hidden sm:block bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">
                                    IELTS Practice Portal
                                </h1>
                            </div>
                            {isInsideWorkspace && (
                                <button onClick={resetToDashboard} className="flex items-center gap-2 text-slate-300 hover:text-white transition font-medium text-sm bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-full border border-slate-700">
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                                    Back to Dashboard
                                </button>
                            )}
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="hidden md:flex flex-col text-right">
                                <span className="font-semibold text-sm leading-tight text-indigo-200">{currentUser.username}</span>
                                <span className="text-xs text-slate-400 uppercase tracking-wider">{currentUser.role}</span>
                            </div>
                            <button onClick={handleLogout} className="bg-slate-800 hover:bg-red-600/90 hover:border-red-500 border border-slate-700 text-slate-300 hover:text-white px-5 py-2 rounded-full text-sm font-medium transition-all duration-200">
                                Sign Out
                            </button>
                        </div>
                    </header>
                    
                    <main className="flex-1 overflow-hidden relative">
                        {currentUser.role === 'admin' 
                            ? <AdminPanel data={data} saveData={saveData} /> 
                            : activeTest 
                                ? <StudentTest test={activeTest} currentUser={currentUser} data={data} saveData={saveData} timeLimit={timeLimit} onFinish={() => setTimeLimit(0)} savedVocab={currentUserVocabList} onSaveVocab={handleSaveVocabToNotebook} />
                            : reviewSubmission 
                                ? <StudentTest test={data.tests.find(t => t.id === reviewSubmission.testId)} currentUser={currentUser} data={data} saveData={saveData} reviewSubmission={reviewSubmission} savedVocab={currentUserVocabList} onSaveVocab={handleSaveVocabToNotebook} />
                            : activeListeningTest
                                ? <StudentListeningTest test={activeListeningTest} currentUser={currentUser} data={data} saveData={saveData} timeLimit={timeLimit} onFinish={() => setTimeLimit(0)} />
                            : reviewListeningSub
                                ? <StudentListeningTest test={(data.listeningTests || []).find(t => t.id === reviewListeningSub.testId)} currentUser={currentUser} data={data} saveData={saveData} reviewSubmission={reviewListeningSub} />
                            : activeWritingTest 
                                ? <StudentWritingTest test={activeWritingTest} currentUser={currentUser} data={data} saveData={saveData} timeLimit={timeLimit} onFinish={() => setTimeLimit(0)} />
                            : reviewWritingSub 
                                ? <StudentWritingTest test={(data.writingTests || []).find(t => t.id === reviewWritingSub.testId) || { id: reviewWritingSub.testId, title: reviewWritingSub.testTitle, taskType: reviewWritingSub.taskType || "IELTS Writing", prompt: reviewWritingSub.prompt || "", minWords: 250 }} currentUser={currentUser} data={data} saveData={saveData} reviewSubmission={reviewWritingSub} />
                            : <StudentDashboard 
                                data={data} 
                                currentUser={currentUser} 
                                onSelectTest={startTestSession} 
                                onReview={setReviewSubmission} 
                                onSelectListeningTest={startListeningSession}
                                onReviewListening={setReviewListeningSub}
                                onSelectWritingTest={startWritingSession}
                                onReviewWriting={setReviewWritingSub}
                                savedVocab={currentUserVocabList}
                                onSaveVocab={handleSaveVocabToNotebook}
                                onRemoveVocab={handleRemoveVocabFromNotebook}
                              />
                        }
                    </main>
                </div>
            );
        }

        function Login({ data, onLogin }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                const user = data.users.find(u => u.username === username && u.password === password);
                if (user) {
                    onLogin(user);
                } else {
                    setError('Incorrect credentials. Please try again.');
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-[conic-gradient(at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-blue-950 to-slate-900 p-4 font-sans">
                    <div className="bg-white/5 p-10 rounded-[2rem] shadow-2xl backdrop-blur-md border border-white/10 w-full max-w-[420px] relative overflow-hidden">
                        <div className="text-center mb-10 mt-4">
                            <div className="bg-indigo-600/20 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 ring-1 ring-indigo-500/30">
                                <span className="text-4xl">📚</span>
                            </div>
                            <h2 className="text-2xl font-bold text-white tracking-tight">IELTS Practice Portal</h2>
                            <p className="text-slate-400 mt-2 text-sm">Sign in to access Reading, Listening & Writing</p>
                        </div>

                        {error && (
                            <div className="bg-red-500/10 border border-red-500/50 text-red-200 p-3 mb-6 rounded-xl text-sm text-center backdrop-blur-sm">
                                {error}
                            </div>
                        )}

                        <form onSubmit={handleLogin} className="space-y-5">
                            <div>
                                <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2 ml-1">Student ID / Username</label>
                                <input type="text" className="w-full bg-slate-900/50 border border-slate-700 text-white p-4 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition outline-none placeholder-slate-600" placeholder="Enter your username" value={username} onChange={e => setUsername(e.target.value)} required />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2 ml-1">Password</label>
                                <input type="password" className="w-full bg-slate-900/50 border border-slate-700 text-white p-4 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition outline-none placeholder-slate-600" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} required />
                            </div>
                            <div className="pt-4">
                                <button type="submit" className="w-full bg-indigo-600 text-white p-4 rounded-xl hover:bg-indigo-500 transition-all font-bold shadow-[0_0_20px_rgba(79,70,229,0.3)] hover:shadow-[0_0_25px_rgba(79,70,229,0.5)] active:scale-[0.98]">
                                    Secure Log In →
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // ==========================================
        // ADMIN PANEL (Reading + Listening + Writing)
        // ==========================================
        function AdminPanel({ data, saveData }) {
            const [newStudent, setNewStudent] = useState('');
            const [newPass, setNewPass] = useState('');
            const [feedbackInputs, setFeedbackInputs] = useState({});
            const [writingFeedbackInputs, setWritingFeedbackInputs] = useState({});
            const [correctionInputs, setCorrectionInputs] = useState({});
            const [onlyUngraded, setOnlyUngraded] = useState(false);
            const [testJsonInput, setTestJsonInput] = useState('');
            const [curriculumMode, setCurriculumMode] = useState('reading'); // 'reading' | 'listening' | 'writing'
            const [cutoffDate, setCutoffDate] = useState('');
            const fileInputRef = useRef(null);

            const listeningTests = data.listeningTests || [];
            const listeningScores = data.listeningScores || [];
            const writingTests = data.writingTests || [];
            const writingSubmissions = data.writingSubmissions || [];

            const handleAddUser = (e) => {
                e.preventDefault();
                if (data.users.find(u => u.username === newStudent)) return alert("User exists!");
                saveData({ ...data, users: [...data.users, { username: newStudent, password: newPass, role: 'student' }] });
                setNewStudent(''); setNewPass('');
            };
            const handleDeleteUser = (username) => {
                if(username === 'admin') return;
                saveData({ ...data, users: data.users.filter(u => u.username !== username) });
            };

            const handleAddTest = () => {
                try {
                    const parsed = JSON.parse(testJsonInput);
                    if (!parsed.id || !parsed.title) throw new Error("Missing ID or Title");
                    
                    if (curriculumMode === 'reading') {
                        const index = data.tests.findIndex(t => t.id === parsed.id);
                        let newTests = [...data.tests];
                        if (index >= 0) newTests[index] = parsed;
                        else newTests.push(parsed);
                        saveData({ ...data, tests: newTests });
                    } else if (curriculumMode === 'listening') {
                        if (!parsed.audioFile || !parsed.questions) {
                            throw new Error("Listening JSON must contain 'audioFile' and 'questions' array.");
                        }
                        const index = listeningTests.findIndex(t => t.id === parsed.id);
                        let newLTests = [...listeningTests];
                        if (index >= 0) newLTests[index] = parsed;
                        else newLTests.push(parsed);
                        saveData({ ...data, listeningTests: newLTests });
                    } else {
                        const index = writingTests.findIndex(t => t.id === parsed.id);
                        let newWTests = [...writingTests];
                        if (index >= 0) newWTests[index] = parsed;
                        else newWTests.push(parsed);
                        saveData({ ...data, writingTests: newWTests });
                    }
                    setTestJsonInput('');
                    alert("Test saved successfully!");
                } catch (err) { alert("JSON Error: " + err.message); }
            };

            const handleDeleteTest = (id, type) => {
                if (!window.confirm("Delete this test?")) return;
                if (type === 'reading') {
                    saveData({ ...data, tests: data.tests.filter(t => t.id !== id) });
                } else if (type === 'listening') {
                    saveData({ ...data, listeningTests: listeningTests.filter(t => t.id !== id) });
                } else {
                    saveData({ ...data, writingTests: writingTests.filter(t => t.id !== id) });
                }
            };

            const submitFeedback = (subId) => {
                if (!feedbackInputs[subId]) return;
                saveData({ ...data, scores: data.scores.map(s => s.subId === subId ? { ...s, feedback: feedbackInputs[subId] } : s) });
                alert("Feedback published!");
            };

            const handleAddInlineCorrection = (sub) => {
                const draft = correctionInputs[sub.subId] || { original: '', corrected: '', note: '' };
                if (!draft.original.trim() || !draft.corrected.trim()) {
                    alert("Vui lòng nhập đầy đủ câu gốc của học sinh và câu sửa chuẩn.");
                    return;
                }
                const existingCorrections = sub.corrections || [];
                const updatedCorrections = [...existingCorrections, {
                    id: Date.now().toString(),
                    original: draft.original.trim(),
                    corrected: draft.corrected.trim(),
                    note: draft.note.trim()
                }];

                saveData({
                    ...data,
                    writingSubmissions: writingSubmissions.map(s => s.subId === sub.subId ? { ...s, corrections: updatedCorrections } : s)
                });
                setCorrectionInputs({ ...correctionInputs, [sub.subId]: { original: '', corrected: '', note: '' } });
            };

            const handleDeleteInlineCorrection = (sub, corrId) => {
                const updatedCorrections = (sub.corrections || []).filter(c => c.id !== corrId);
                saveData({
                    ...data,
                    writingSubmissions: writingSubmissions.map(s => s.subId === sub.subId ? { ...s, corrections: updatedCorrections } : s)
                });
            };

            const submitWritingTeacherFeedback = (subId) => {
                const currentText = writingFeedbackInputs[subId];
                if (currentText === undefined && !writingSubmissions.find(s => s.subId === subId)?.teacherFeedback) {
                    return alert("Vui lòng nhập nhận xét trước khi lưu.");
                }
                saveData({
                    ...data,
                    writingSubmissions: writingSubmissions.map(s => s.subId === subId ? { 
                        ...s, 
                        teacherFeedback: currentText !== undefined ? currentText : s.teacherFeedback 
                    } : s)
                });
                alert("Teacher feedback saved!");
            };

            const handleCleanup = () => {
                if (!cutoffDate) return alert("Select a date!");
                const [year, month, day] = cutoffDate.split('-').map(Number);
                const cutoff = new Date(year, month - 1, day, 23, 59, 59, 999).getTime();
                const remaining = data.scores.filter(s => new Date(s.date).getTime() > cutoff);
                const remainingL = listeningScores.filter(s => new Date(s.date).getTime() > cutoff);
                const remainingW = writingSubmissions.filter(s => new Date(s.date).getTime() > cutoff);
                if(window.confirm(`Delete old entries?`)) {
                    saveData({ ...data, scores: remaining, listeningScores: remainingL, writingSubmissions: remainingW });
                }
            };

            const exportData = () => {
                const dataStr = JSON.stringify(data, null, 2);
                const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
                const link = document.createElement('a');
                link.setAttribute('href', dataUri);
                link.setAttribute('download', 'academic_portal_backup.json');
                link.click();
            };

            const filteredWritingSubs = writingSubmissions
                .slice()
                .reverse()
                .filter(sub => !onlyUngraded || !sub.teacherFeedback || !sub.teacherFeedback.trim());

            const filteredReadingWritingTasks = data.scores
                .filter(s => s.writingAnswer)
                .reverse()
                .filter(sub => !onlyUngraded || !sub.feedback || !sub.feedback.trim());

            const ungradedCount = writingSubmissions.filter(s => !s.teacherFeedback || !s.teacherFeedback.trim()).length +
                                  data.scores.filter(s => s.writingAnswer && (!s.feedback || !s.feedback.trim())).length;

            return (
                <div className="p-8 max-w-7xl mx-auto overflow-y-auto h-full space-y-8 pb-20">
                    <div className="bg-white border-l-4 border-indigo-600 p-6 rounded-xl shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <h2 className="text-xl font-bold text-slate-800 mb-1 flex items-center gap-2">
                                <span className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> Cloud Database Active
                            </h2>
                            <p className="text-sm text-slate-500">
                                Reading: {data.tests.length} | Listening: {listeningTests.length} | Writing: {writingTests.length} | Submissions: {data.scores.length + listeningScores.length + writingSubmissions.length}
                            </p>
                        </div>
                        <div className="flex gap-4 items-center flex-wrap justify-end">
                            <div className="flex items-center gap-2 border border-slate-200 bg-slate-50 p-2 rounded-lg">
                                <input type="date" value={cutoffDate} onChange={e=>setCutoffDate(e.target.value)} className="bg-transparent text-sm text-slate-700 outline-none" />
                                <button onClick={handleCleanup} className="text-xs bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1.5 rounded-md font-semibold transition">Purge Old</button>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={exportData} className="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 font-semibold py-2.5 px-4 rounded-lg text-sm transition">
                                    Download Backup ↓
                                </button>
                                <button onClick={() => fileInputRef.current.click()} className="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 font-semibold py-2.5 px-4 rounded-lg text-sm transition">
                                    Upload Backup ↑
                                </button>
                                <input type="file" ref={fileInputRef} onChange={(e) => {
                                    const file = e.target.files[0];
                                    if (!file) return;
                                    const reader = new FileReader();
                                    reader.onload = (event) => {
                                        try {
                                            const importedData = JSON.parse(event.target.result);
                                            if(importedData.users && importedData.tests && importedData.scores) {
                                                saveData({
                                                    ...DEFAULT_DATA,
                                                    ...importedData,
                                                    listeningTests: importedData.listeningTests || [],
                                                    listeningScores: importedData.listeningScores || [],
                                                    writingTests: (importedData.writingTests && importedData.writingTests.length > 0) ? importedData.writingTests : DEFAULT_WRITING_TESTS,
                                                    writingSubmissions: importedData.writingSubmissions || [],
                                                    userVocab: importedData.userVocab || {}
                                                });
                                                alert("Data successfully restored!");
                                            } else {
                                                alert("This file is missing required data.");
                                            }
                                        } catch (err) {
                                            alert("Invalid backup file format.");
                                        }
                                    };
                                    reader.readAsText(file);
                                    e.target.value = null;
                                }} accept=".json" className="hidden" />
                            </div>
                        </div>
                    </div>

                    <div className="grid md:grid-cols-2 gap-8">
                        {/* Users */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                            <h2 className="text-lg font-bold text-slate-800 mb-6">Student Directory</h2>
                            <form onSubmit={handleAddUser} className="flex gap-3 mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200">
                                <input type="text" placeholder="Username" className="w-1/3 border-slate-300 border p-2.5 rounded-md text-sm outline-none focus:border-indigo-500" value={newStudent} onChange={e=>setNewStudent(e.target.value)} required />
                                <input type="password" placeholder="Password" className="w-1/3 border-slate-300 border p-2.5 rounded-md text-sm outline-none focus:border-indigo-500" value={newPass} onChange={e=>setNewPass(e.target.value)} required />
                                <button type="submit" className="w-1/3 bg-slate-800 text-white rounded-md text-sm font-semibold hover:bg-slate-700 transition">Register</button>
                            </form>
                            <div className="max-h-64 overflow-y-auto pr-2 space-y-2">
                                {data.users.filter(u => u.role === 'student').map(u => (
                                    <div key={u.username} className="flex justify-between items-center bg-white p-3 rounded-lg border border-slate-100 hover:border-slate-300 transition">
                                        <div className="flex items-center gap-3">
                                            <div className="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 font-bold text-xs">{u.username.charAt(0)}</div>
                                            <span className="font-semibold text-slate-700 text-sm">{u.username}</span>
                                        </div>
                                        <button onClick={() => handleDeleteUser(u.username)} className="text-red-500 hover:text-red-700 text-xs font-bold uppercase tracking-wider bg-red-50 px-3 py-1 rounded">Remove</button>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Recent Assessments */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                            <h2 className="text-lg font-bold text-slate-800 mb-6">Recent Assessments</h2>
                            <div className="max-h-80 overflow-y-auto pr-2 space-y-3">
                                {[
                                    ...data.scores.map(s => ({ ...s, _type: 'reading' })),
                                    ...listeningScores.map(l => ({ ...l, _type: 'listening' })),
                                    ...writingSubmissions.map(w => ({ ...w, _type: 'writing' }))
                                ].sort((a, b) => new Date(b.date) - new Date(a.date)).map((s, i) => {
                                    if (s._type === 'writing') {
                                        return (
                                            <div key={`w_${i}`} className="flex justify-between items-center bg-indigo-50/40 p-4 rounded-xl border border-indigo-100">
                                                <div>
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <span className="font-bold text-slate-800">{s.username}</span>
                                                        <span className="text-[10px] font-bold uppercase bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded">Writing</span>
                                                        <span className="text-xs text-slate-400 bg-white px-2 py-0.5 rounded border">{new Date(s.date).toLocaleDateString()}</span>
                                                    </div>
                                                    <p className="text-xs text-slate-500 truncate max-w-[250px] font-medium">{s.testTitle} ({s.wordCount} words)</p>
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-sm font-bold text-indigo-600">
                                                        {s.teacherFeedback ? '✓ Graded' : 'Pending Review'}
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    }
                                    if (s._type === 'listening') {
                                        return (
                                            <div key={`l_${i}`} className="flex justify-between items-center bg-sky-50/60 p-4 rounded-xl border border-sky-100">
                                                <div>
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <span className="font-bold text-slate-800">{s.username}</span>
                                                        <span className="text-[10px] font-bold uppercase bg-sky-100 text-sky-700 px-2 py-0.5 rounded">Listening</span>
                                                        <span className="text-xs text-slate-400 bg-white px-2 py-0.5 rounded border">{new Date(s.date).toLocaleDateString()}</span>
                                                    </div>
                                                    <p className="text-xs text-slate-500 truncate max-w-[250px] font-medium">{s.testTitle}</p>
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-xl font-black text-sky-600">{s.score}<span className="text-sm text-slate-400 font-medium">/{s.maxScore || 5}</span></div>
                                                </div>
                                            </div>
                                        );
                                    }
                                    const t = data.tests.find(test=>test.id===s.testId);
                                    const max = t ? (t.mcq.length + (t.fib?.length || 0)) : 20;
                                    return (
                                        <div key={`r_${i}`} className="flex justify-between items-center bg-slate-50 p-4 rounded-xl border border-slate-100">
                                            <div>
                                                <div className="flex items-center gap-2 mb-1">
                                                    <span className="font-bold text-slate-800">{s.username}</span>
                                                    <span className="text-[10px] font-bold uppercase bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded">Reading</span>
                                                    <span className="text-xs text-slate-400 bg-white px-2 py-0.5 rounded border">{new Date(s.date).toLocaleDateString()}</span>
                                                </div>
                                                <p className="text-xs text-slate-500 truncate max-w-[250px] font-medium">{s.testTitle}</p>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-xl font-black text-indigo-600">{s.score}<span className="text-sm text-slate-400 font-medium">/{max}</span></div>
                                            </div>
                                        </div>
                                    );
                                })}

        // ==========================================
        // LISTENING TEST INTERFACE (Audio Player + Speed Control + Transcript Reveal + Auto-Grading)
        // ==========================================
        function StudentListeningTest({ test, currentUser, data, saveData, reviewSubmission, timeLimit, onFinish }) {
            const [answers, setAnswers] = useState(() => reviewSubmission ? (reviewSubmission.userAnswers || {}) : {});
            const [submitted, setSubmitted] = useState(!!reviewSubmission);
            const [score, setScore] = useState(reviewSubmission ? reviewSubmission.score : 0);
            const [playbackRate, setPlaybackRate] = useState(1.0);
            const [showScript, setShowScript] = useState(!!reviewSubmission);
            const audioRef = useRef(null);

            const initialTime = timeLimit ? timeLimit * 60 : 0;
            const [timeLeft, setTimeLeft] = useState(initialTime);

            const questions = test?.questions || [];
            const maxScore = questions.length;

            useEffect(() => {
                if (audioRef.current) {
                    audioRef.current.playbackRate = playbackRate;
                }
            }, [playbackRate]);

            useEffect(() => {
                if (!timeLimit || submitted || reviewSubmission) return;
                if (timeLeft <= 0) {
                    handleSubmitListening();
                    return;
                }
                const timerId = setInterval(() => {
                    setTimeLeft(prev => prev - 1);
                }, 1000);
                return () => clearInterval(timerId);
            }, [timeLeft, timeLimit, submitted, reviewSubmission]);

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m}:${s.toString().padStart(2, '0')}`;
            };

            const skipAudio = (delta) => {
                if (audioRef.current) {
                    audioRef.current.currentTime = Math.max(0, audioRef.current.currentTime + delta);
                }
            };

            const handleSelectOption = (qIndex, letter) => {
                if (submitted) return;
                setAnswers(prev => ({ ...prev, [qIndex]: letter }));
            };

            const handleSubmitListening = () => {
                let correctCount = 0;
                questions.forEach((q, idx) => {
                    if (answers[idx] === q.answer) {
                        correctCount++;
                    }
                });

                setScore(correctCount);
                setSubmitted(true);
                setShowScript(true);
                if (onFinish) onFinish();

                const newSub = {
                    subId: Date.now().toString(),
                    username: currentUser.username,
                    testId: test.id,
                    testTitle: test.title,
                    score: correctCount,
                    maxScore: maxScore,
                    userAnswers: answers,
                    date: new Date().toISOString()
                };

                const existingLSubs = data.listeningScores || [];
                saveData({ ...data, listeningScores: [...existingLSubs, newSub] });
            };

            const handleRetry = () => {
                setAnswers({});
                setSubmitted(false);
                setShowScript(false);
                setScore(0);
                if (audioRef.current) {
                    audioRef.current.currentTime = 0;
                }
            };

            if (!test) return null;

            return (
                <div className="flex flex-col md:flex-row h-full relative">
                    {!reviewSubmission && timeLimit > 0 && (
                        <div className={`fixed bottom-6 right-6 md:bottom-auto md:top-24 md:right-8 z-50 px-5 py-2.5 rounded-full font-black shadow-2xl border-2 transition-colors duration-500 flex items-center gap-2 backdrop-blur-md ${
                            submitted ? 'bg-slate-800/95 text-white border-slate-700 hidden md:flex' :
                            timeLeft <= 60 ? 'bg-red-500/95 text-white border-red-400 animate-pulse' : 
                            'bg-sky-600/95 text-white border-sky-400'
                        }`}>
                            <span className="text-xl">⏱</span>
                            <span className="text-xl tracking-wider font-mono">{submitted ? 'DONE' : formatTime(timeLeft)}</span>
                        </div>
                    )}

                    {/* LEFT PANEL: AUDIO PLAYER & TRANSCRIPT */}
                    <div className="w-full md:w-1/2 h-full border-r border-slate-300 paper-bg overflow-y-auto flex flex-col shadow-[inset_-10px_0_20px_-15px_rgba(0,0,0,0.1)]">
                        <div className="bg-white/90 backdrop-blur-md px-6 py-4 border-b border-slate-200 sticky top-0 z-10 flex justify-between items-center shadow-sm">
                            <span className="text-xs font-bold uppercase tracking-widest text-sky-600">🎧 Listening Section</span>
                            <span className="font-bold text-slate-800 truncate max-w-xs">{test.title}</span>
                        </div>

                        <div className="p-8 md:p-10 space-y-6 pb-24">
                            {/* Audio Player Card */}
                            <div className="bg-slate-900 text-white p-6 rounded-3xl shadow-xl border border-slate-800 space-y-4">
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 rounded-2xl bg-sky-500/20 text-sky-400 flex items-center justify-center text-xl">
                                            🎙️
                                        </div>
                                        <div>
                                            <h3 className="font-bold text-base text-white leading-tight">{test.title}</h3>
                                            <p className="text-xs text-slate-400 mt-0.5">Listen carefully and answer all {maxScore} questions</p>
                                        </div>
                                    </div>
                                </div>

                                <audio
                                    ref={audioRef}
                                    controls
                                    src={test.audioFile}
                                    className="w-full h-11 rounded-xl"
                                    preload="metadata"
                                >
                                    Your browser does not support the audio element.
                                </audio>

                                {/* Playback Controls: Skip & Speed */}
                                <div className="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-slate-800 text-xs">
                                    <div className="flex items-center gap-2">
                                        <button
                                            type="button"
                                            onClick={() => skipAudio(-5)}
                                            className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg font-bold transition"
                                        >
                                            ↺ -5s
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => skipAudio(5)}
                                            className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg font-bold transition"
                                        >
                                            +5s ↻
                                        </button>
                                    </div>

                                    <div className="flex items-center gap-1.5">
                                        <span className="text-slate-400 font-semibold mr-1">Speed:</span>
                                        {[0.75, 1.0, 1.25].map(rate => (
                                            <button
                                                key={rate}
                                                type="button"
                                                onClick={() => setPlaybackRate(rate)}
                                                className={`px-2.5 py-1 rounded-lg font-bold transition ${
                                                    playbackRate === rate
                                                        ? 'bg-sky-500 text-white'
                                                        : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                                                }`}
                                            >
                                                {rate}x
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* Transcript / Audio Script Box */}
                            {test.script && (
                                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                                    <div className="bg-slate-50 px-6 py-3.5 border-b border-slate-200 flex justify-between items-center">
                                        <span className="text-xs font-bold uppercase tracking-wider text-slate-600 flex items-center gap-2">
                                            <span>📜</span> Audio Transcript
                                        </span>
                                        {submitted ? (
                                            <button
                                                type="button"
                                                onClick={() => setShowScript(!showScript)}
                                                className="text-xs font-bold text-sky-700 bg-sky-50 hover:bg-sky-100 px-3 py-1 rounded-full transition"
                                            >
                                                {showScript ? 'Ẩn Transcript ▲' : 'Hiện Transcript ▼'}
                                            </button>
                                        ) : (
                                            <span className="text-xs font-semibold text-amber-700 bg-amber-50 px-2.5 py-0.5 rounded-full border border-amber-200">
                                                🔒 Mở khóa sau khi nộp bài
                                            </span>
                                        )}
                                    </div>

                                    {submitted && showScript ? (
                                        <div className="p-6 font-serif text-[15px] leading-relaxed text-slate-800 whitespace-pre-wrap space-y-2 bg-[#FDFBF7]">
                                            {test.script}
                                        </div>
                                    ) : !submitted ? (
                                        <div className="p-8 text-center text-slate-400 text-sm">
                                            Hãy nghe audio và hoàn thành các câu hỏi bên phải. Transcript sẽ tự động hiển thị để bạn đối chiếu từ vựng sau khi bấm <strong>Submit Listening Test</strong>.
                                        </div>
                                    ) : null}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* RIGHT PANEL: QUESTIONS */}
                    <div className="w-full md:w-1/2 h-full bg-slate-50 overflow-y-auto p-6 md:p-10 relative pb-32">
                        {submitted && (
                            <div className="mb-8 bg-white border border-sky-100 p-6 rounded-2xl shadow-lg flex justify-between items-center sticky top-0 z-20 overflow-hidden relative">
                                <div className="absolute top-0 left-0 w-2 h-full bg-sky-500"></div>
                                <div>
                                    <p className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Listening Score</p>
                                    <h2 className="text-3xl font-black text-slate-800">{score} <span className="text-xl text-slate-400 font-medium">/ {maxScore}</span></h2>
                                </div>
                                {!reviewSubmission && (
                                    <button onClick={handleRetry} className="bg-slate-900 hover:bg-sky-600 text-white font-bold py-3 px-6 rounded-xl shadow-md transition-colors duration-300">
                                        Practice Again ↺
                                    </button>
                                )}
                            </div>
                        )}

                        <div className="mb-10">
                            <h3 className="font-bold text-lg mb-6 text-slate-800 border-b border-slate-200 pb-2">Comprehension Questions</h3>
                            <div className="space-y-6">
                                {questions.map((q, i) => {
                                    const userChoice = answers[i];
                                    const isCorrect = submitted && userChoice === q.answer;
                                    const isWrong = submitted && userChoice !== q.answer;

                                    return (
                                        <div key={q.id || i} className={`p-6 rounded-2xl border ${isCorrect ? 'bg-emerald-50/50 border-emerald-200' : isWrong ? 'bg-red-50/50 border-red-200' : 'bg-white border-slate-200 shadow-sm'}`}>
                                            <p className="font-bold text-slate-800 mb-4">{i + 1}. {q.question}</p>
                                            <div className="space-y-2">
                                                {(q.options || []).map((opt, oIdx) => {
                                                    const letter = opt.charAt(0);
                                                    const isSelected = userChoice === letter;
                                                    const isRightAnswer = submitted && q.answer === letter;

                                                    let optionStyle = 'hover:bg-slate-50 border-slate-100';
                                                    if (submitted) {
                                                        if (isRightAnswer) optionStyle = 'bg-emerald-100/70 border-emerald-400 font-semibold';
                                                        else if (isSelected && !isRightAnswer) optionStyle = 'bg-red-100/70 border-red-400';
                                                    } else if (isSelected) {
                                                        optionStyle = 'bg-sky-50 border-sky-300 shadow-[inset_0_0_0_1px_rgba(56,189,248,1)]';
                                                    }

                                                    return (
                                                        <label 
                                                            key={oIdx} 
                                                            className={`flex items-center p-3 rounded-xl border transition-all ${optionStyle} ${submitted ? 'cursor-default' : 'cursor-pointer'}`}
                                                        >
                                                            <input 
                                                                type="radio" 
                                                                name={`l_q_${i}`} 
                                                                className="hidden" 
                                                                disabled={submitted} 
                                                                checked={isSelected} 
                                                                onChange={() => handleSelectOption(i, letter)} 
                                                            />
                                                            <div className={`w-5 h-5 rounded-full border flex items-center justify-center mr-4 flex-shrink-0 ${isSelected ? 'border-sky-600' : 'border-slate-300'}`}>
                                                                {isSelected && <div className="w-2.5 h-2.5 bg-sky-600 rounded-full"></div>}
                                                            </div>
                                                            <span className={isSelected ? 'text-slate-900 font-medium' : 'text-slate-600'}>{opt}</span>
                                                        </label>
                                                    );
                                                })}
                                            </div>

                                            {submitted && (
                                                <div className="mt-4 pt-3 border-t border-slate-200/70 space-y-1.5 text-sm">
                                                    {isCorrect ? (
                                                        <div className="text-emerald-700 font-bold flex items-center gap-1.5">
                                                            <span>✓</span> Chính xác!
                                                        </div>
                                                    ) : (
                                                        <div className="text-red-600 font-bold flex items-center gap-1.5">
                                                            <span>✕</span> Chưa đúng — Đáp án đúng là: <span className="underline">{q.answer}</span>
                                                        </div>
                                                    )}
                                                    {q.explanation && (
                                                        <p className="text-xs text-slate-600 bg-white/80 p-3 rounded-xl border border-slate-200/80 leading-relaxed">
                                                            💡 <strong>Giải thích:</strong> {q.explanation}
                                                        </p>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {!submitted && (
                            <button onClick={handleSubmitListening} className="w-full bg-slate-900 hover:bg-sky-600 text-white font-bold py-5 rounded-2xl shadow-lg hover:shadow-xl transition-all duration-300 text-lg transform hover:-translate-y-1">
                                Submit Listening Test
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        // ==========================================
        // VOCABULARY FLASHCARDS & MINI-GAME COMPONENT
        // ==========================================
        function VocabularyFlashcards({ savedVocab, onSaveVocab, onRemoveVocab }) {
            const [mode, setMode] = useState('flashcards');
            const [cardIndex, setCardIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);

            const [newWord, setNewWord] = useState('');
            const [newMeaning, setNewMeaning] = useState('');
            const [newExample, setNewExample] = useState('');

            const [quizIndex, setQuizIndex] = useState(0);
            const [quizScore, setQuizScore] = useState(0);
            const [selectedOption, setSelectedOption] = useState(null);
            const [quizFinished, setQuizFinished] = useState(false);

            const handleAddCustomWord = (e) => {
                e.preventDefault();
                if (!newWord.trim() || !newMeaning.trim()) return;
                onSaveVocab({ w: newWord.trim(), m: newMeaning.trim(), example: newExample.trim() }, 'Tự thêm');
                setNewWord('');
                setNewMeaning('');
                setNewExample('');
            };

            const quizQuestions = useMemo(() => {
                if (savedVocab.length < 4) return [];
                const shuffled = [...savedVocab].sort(() => 0.5 - Math.random());
                return shuffled.map(target => {
                    const distractors = savedVocab
                        .filter(item => item.w !== target.w)
                        .sort(() => 0.5 - Math.random())
                        .slice(0, 3)
                        .map(d => d.m);
                    const options = [...distractors, target.m].sort(() => 0.5 - Math.random());
                    return {
                        word: target.w,
                        correctMeaning: target.m,
                        options
                    };
                });
            }, [savedVocab, mode]);

            const handleQuizAnswer = (opt) => {
                if (selectedOption !== null) return;
                setSelectedOption(opt);
                if (opt === quizQuestions[quizIndex].correctMeaning) {
                    setQuizScore(prev => prev + 1);
                }
                setTimeout(() => {
                    if (quizIndex + 1 < quizQuestions.length) {
                        setQuizIndex(prev => prev + 1);
                        setSelectedOption(null);
                    } else {
                        setQuizFinished(true);
                    }
                }, 950);
            };

            const resetQuiz = () => {
                setQuizIndex(0);
                setQuizScore(0);
                setSelectedOption(null);
                setQuizFinished(false);
            };

            const safeIndex = savedVocab.length > 0 ? Math.min(cardIndex, savedVocab.length - 1) : 0;
            const currentCard = savedVocab[safeIndex];

            return (
                <div className="space-y-8 pb-20">
                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-4">+ Thêm từ vựng mới vào sổ tay</h3>
                        <form onSubmit={handleAddCustomWord} className="grid sm:grid-cols-4 gap-3">
                            <input
                                type="text"
                                placeholder="Từ tiếng Anh (VD: Mitigate)"
                                className="border border-slate-200 p-3 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                                value={newWord}
                                onChange={e => setNewWord(e.target.value)}
                                required
                            />
                            <input
                                type="text"
                                placeholder="Nghĩa tiếng Việt (VD: Giảm nhẹ)"
                                className="border border-slate-200 p-3 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                                value={newMeaning}
                                onChange={e => setNewMeaning(e.target.value)}
                                required
                            />
                            <input
                                type="text"
                                placeholder="Câu ví dụ (tùy chọn)"
                                className="border border-slate-200 p-3 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                                value={newExample}
                                onChange={e => setNewExample(e.target.value)}
                            />
                            <button type="submit" className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl text-sm transition shadow-sm">
                                Lưu từ vựng
                            </button>
                        </form>
                    </div>

                    {savedVocab.length === 0 ? (
                        <div className="bg-white p-12 rounded-2xl border border-slate-200 text-center">
                            <div className="text-4xl mb-3">🗂️</div>
                            <h3 className="text-lg font-bold text-slate-800">Sổ tay từ vựng đang trống</h3>
                            <p className="text-sm text-slate-500 mt-1 max-w-md mx-auto">
                                Khi làm bài Reading, hãy bấm vào các từ được gạch chân màu tím hoặc trong bảng Glossary và chọn <strong>"+ Lưu vào sổ tay"</strong> để luyện Flashcards tại đây.
                            </p>
                        </div>
                    ) : (
                        <>
                            <div className="flex flex-wrap justify-between items-center gap-4">
                                <div className="flex bg-slate-200/80 p-1 rounded-xl">
                                    <button
                                        onClick={() => { setMode('flashcards'); setIsFlipped(false); }}
                                        className={`px-4 py-2 rounded-lg text-xs font-bold transition ${mode === 'flashcards' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600'}`}
                                    >
                                        🃏 Lật thẻ Flashcards ({savedVocab.length})
                                    </button>
                                    <button
                                        onClick={() => { setMode('quiz'); resetQuiz(); }}
                                        className={`px-4 py-2 rounded-lg text-xs font-bold transition ${mode === 'quiz' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600'}`}
                                    >
                                        🎯 Mini-Game Trắc nghiệm
                                    </button>
                                    <button
                                        onClick={() => setMode('list')}
                                        className={`px-4 py-2 rounded-lg text-xs font-bold transition ${mode === 'list' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600'}`}
                                    >
                                        📋 Danh sách từ ({savedVocab.length})
                                    </button>
                                </div>
                            </div>

                            {mode === 'flashcards' && currentCard && (
                                <div className="max-w-xl mx-auto">
                                    <div 
                                        onClick={() => setIsFlipped(!isFlipped)}
                                        className="bg-white border-2 border-indigo-100 rounded-3xl p-10 min-h-[280px] shadow-lg hover:shadow-xl transition-all cursor-pointer flex flex-col items-center justify-center text-center relative select-none"
                                    >
                                        <span className="absolute top-5 left-6 text-xs font-bold uppercase tracking-wider text-slate-400">
                                            {isFlipped ? 'Mặt sau • Nghĩa tiếng Việt' : 'Mặt trước • Tiếng Anh (Bấm để lật)'}
                                        </span>
                                        <span className="absolute top-5 right-6 text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">
                                            {safeIndex + 1} / {savedVocab.length}
                                        </span>

                                        {!isFlipped ? (
                                            <div className="space-y-4 mt-4">
                                                <h3 className="text-4xl font-black text-slate-800 tracking-tight">{currentCard.w}</h3>
                                                <button
                                                    type="button"
                                                    onClick={(e) => speakWord(currentCard.w, e)}
                                                    className="inline-flex items-center gap-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-4 py-2 rounded-full text-sm transition relative z-10"
                                                >
                                                    <span>🔊</span> Nghe phát âm
                                                </button>
                                            </div>
                                        ) : (
                                            <div className="space-y-3 mt-4">
                                                <p className="text-2xl font-bold text-indigo-700">{currentCard.m}</p>
                                                {currentCard.example && (
                                                    <p className="text-sm text-slate-600 italic font-serif bg-slate-50 p-3 rounded-xl border border-slate-100">
                                                        "{currentCard.example}"
                                                    </p>
                                                )}
                                                {currentCard.source && (
                                                    <p className="text-xs text-slate-400">Nguồn: {currentCard.source}</p>
                                                )}
                                            </div>
                                        )}
                                    </div>

                                    <div className="flex justify-between items-center mt-6 gap-4">
                                        <button
                                            onClick={() => { setIsFlipped(false); setCardIndex((safeIndex - 1 + savedVocab.length) % savedVocab.length); }}
                                            className="flex-1 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-bold py-3 rounded-xl transition text-sm"
                                        >
                                            ← Thẻ trước
                                        </button>
                                        <button
                                            onClick={() => setIsFlipped(!isFlipped)}
                                            className="bg-indigo-50 border border-indigo-200 text-indigo-700 font-bold py-3 px-6 rounded-xl text-sm"
                                        >
                                            🔄 Lật thẻ
                                        </button>
                                        <button
                                            onClick={() => { setIsFlipped(false); setCardIndex((safeIndex + 1) % savedVocab.length); }}
                                            className="flex-1 bg-slate-900 hover:bg-indigo-600 text-white font-bold py-3 rounded-xl transition text-sm"
                                        >
                                            Thẻ tiếp →
                                        </button>
                                    </div>
                                </div>
                            )}

                            {mode === 'quiz' && (
                                <div className="max-w-xl mx-auto">
                                    {savedVocab.length < 4 ? (
                                        <div className="bg-amber-50 border border-amber-200 p-6 rounded-2xl text-center text-amber-900 text-sm">
                                            Bạn cần lưu ít nhất <strong>4 từ vựng</strong> vào sổ tay để mở khóa Mini-Game trắc nghiệm 4 đáp án (Hiện có: {savedVocab.length}/4 từ).
                                        </div>
                                    ) : quizFinished ? (
                                        <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-lg text-center space-y-4">
                                            <div className="text-5xl">🏆</div>
                                            <h3 className="text-2xl font-black text-slate-800">Hoàn thành Mini-Game!</h3>
                                            <p className="text-slate-600">
                                                Điểm của bạn: <span className="font-black text-indigo-600 text-xl">{quizScore} / {quizQuestions.length}</span>
                                            </p>
                                            <button onClick={resetQuiz} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-3 rounded-xl text-sm transition">
                                                Chơi lại từ đầu ↺
                                            </button>
                                        </div>
                                    ) : quizQuestions[quizIndex] && (
                                        <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-lg space-y-6">
                                            <div className="flex justify-between items-center text-xs font-bold text-slate-400 uppercase">
                                                <span>Câu hỏi {quizIndex + 1} / {quizQuestions.length}</span>
                                                <span className="text-indigo-600">Điểm: {quizScore}</span>
                                            </div>
                                            <div className="text-center py-4 bg-slate-50 rounded-2xl border border-slate-100">
                                                <p className="text-xs text-slate-400 mb-1">Chọn nghĩa đúng của từ:</p>
                                                <div className="flex items-center justify-center gap-2">
                                                    <h3 className="text-3xl font-black text-slate-800">{quizQuestions[quizIndex].word}</h3>
                                                    <button onClick={(e) => speakWord(quizQuestions[quizIndex].word, e)} className="text-lg hover:scale-110 transition">🔊</button>
                                                </div>
                                            </div>
                                            <div className="space-y-3">
                                                {quizQuestions[quizIndex].options.map((opt, idx) => {
                                                    const isCorrect = opt === quizQuestions[quizIndex].correctMeaning;
                                                    const isChosen = selectedOption === opt;
                                                    let btnStyle = "bg-white hover:bg-slate-50 border-slate-200 text-slate-700";
                                                    if (selectedOption !== null) {
                                                        if (isCorrect) btnStyle = "bg-emerald-50 border-emerald-500 text-emerald-800 font-bold";
                                                        else if (isChosen) btnStyle = "bg-red-50 border-red-500 text-red-800";
                                                    }
                                                    return (
                                                        <button
                                                            key={idx}
                                                            onClick={() => handleQuizAnswer(opt)}
                                                            className={`w-full text-left p-4 rounded-xl border-2 transition text-sm ${btnStyle}`}
                                                        >
                                                            {opt}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {mode === 'list' && (
                                <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                                    <div className="divide-y divide-slate-100">
                                        {savedVocab.map((item, idx) => (
                                            <div key={idx} className="p-4 flex items-center justify-between gap-4 hover:bg-slate-50 transition">
                                                <div>
                                                    <div className="flex items-center gap-2">
                                                        <span className="font-bold text-indigo-800 text-base">{item.w}</span>
                                                        <button onClick={(e) => speakWord(item.w, e)} className="text-sm hover:scale-110 transition" title="Nghe phát âm">🔊</button>
                                                        {item.source && <span className="text-[11px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded">{item.source}</span>}
                                                    </div>
                                                    <p className="text-sm text-slate-600 mt-0.5">{item.m}</p>
                                                    {item.example && <p className="text-xs text-slate-400 italic mt-1">"{item.example}"</p>}
                                                </div>
                                                <button onClick={() => onRemoveVocab(item.w)} className="text-xs text-red-500 hover:bg-red-50 px-3 py-1.5 rounded-lg font-bold transition">
                                                    Xóa
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </>
                    )}
                </div>
            );
        }

        // ==========================================
        // STUDENT DASHBOARD (Reading + Listening + Writing + Vocab)
        // ==========================================
        function StudentDashboard({ data, currentUser, onSelectTest, onReview, onSelectListeningTest, onReviewListening, onSelectWritingTest, onReviewWriting, savedVocab, onSaveVocab, onRemoveVocab }) {
            const [activeTab, setActiveTab] = useState('reading');
            const [selectedTime, setSelectedTime] = useState(0);
            const [searchQuery, setSearchQuery] = useState('');
            const [statusFilter, setStatusFilter] = useState('all');

            const userScores = data.scores.filter(s => s.username === currentUser.username);
            const userListeningScores = (data.listeningScores || []).filter(s => s.username === currentUser.username);
            const userWritingSubs = (data.writingSubmissions || []).filter(s => s.username === currentUser.username);
            
            const listeningTests = data.listeningTests || [];
            const writingTests = data.writingTests || [];

            const totalCompleted = userScores.length + userListeningScores.length + userWritingSubs.length;
            const readingPercentages = userScores.map(s => {
                const t = data.tests.find(item => item.id === s.testId);
                const max = t ? (t.mcq.length + (t.fib?.length || 0)) : 20;
                return {
                    title: s.testTitle,
                    score: s.score,
                    max,
                    pct: max > 0 ? Math.round((s.score / max) * 100) : 0,
                    date: new Date(s.date).toLocaleDateString('vi-VN')
                };
            });
            const avgReadingPct = readingPercentages.length > 0
                ? Math.round(readingPercentages.reduce((acc, cur) => acc + cur.pct, 0) / readingPercentages.length)
                : 0;

            const filteredReadingTests = data.tests.filter(test => {
                const matchesSearch = test.title.toLowerCase().includes(searchQuery.toLowerCase());
                const isDone = userScores.some(s => s.testId === test.id);
                if (statusFilter === 'done') return matchesSearch && isDone;
                if (statusFilter === 'todo') return matchesSearch && !isDone;
                return matchesSearch;
            });

            const filteredListeningTests = listeningTests.filter(lTest => {
                const matchesSearch = lTest.title.toLowerCase().includes(searchQuery.toLowerCase());
                const isDone = userListeningScores.some(s => s.testId === lTest.id);
                if (statusFilter === 'done') return matchesSearch && isDone;
                if (statusFilter === 'todo') return matchesSearch && !isDone;
                return matchesSearch;
            });

            const filteredWritingTests = writingTests.filter(wTest => {
                const matchesSearch = wTest.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      (wTest.prompt && wTest.prompt.toLowerCase().includes(searchQuery.toLowerCase()));
                const isDone = userWritingSubs.some(s => s.testId === wTest.id);
                if (statusFilter === 'done') return matchesSearch && isDone;
                if (statusFilter === 'todo') return matchesSearch && !isDone;
                return matchesSearch;
            });

            return (
                <div className="p-6 md:p-10 max-w-5xl mx-auto h-full overflow-y-auto">
                    
                    {/* STUDENT PROGRESS TRACKER */}
