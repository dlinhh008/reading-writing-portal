        // ==========================================
        // WRITING TEST INTERFACE
        // ==========================================
        function StudentWritingTest({ test, currentUser, data, saveData, reviewSubmission, timeLimit, onFinish }) {
            const draftStorageKey = `writing_draft_${currentUser.username}_${test.id}`;
            
            const [essayText, setEssayText] = useState(() => {
                if (reviewSubmission) return reviewSubmission.essayText || '';
                const savedDraft = localStorage.getItem(draftStorageKey);
                return savedDraft || '';
            });
            const [isSubmitted, setIsSubmitted] = useState(!!reviewSubmission);
            const [lastSavedTime, setLastSavedTime] = useState(() => {
                return (!reviewSubmission && localStorage.getItem(draftStorageKey)) ? 'Đã khôi phục bản nháp' : null;
            });
            const [showModelTab, setShowModelTab] = useState(false);

            const initialTime = timeLimit ? timeLimit * 60 : 0;
            const [timeLeft, setTimeLeft] = useState(initialTime);

            const words = essayText.trim() ? essayText.trim().split(/\s+/).length : 0;
            const minWords = test.minWords || 250;

            useEffect(() => {
                if (reviewSubmission || isSubmitted) return;
                const timeoutId = setTimeout(() => {
                    if (essayText.trim()) {
                        localStorage.setItem(draftStorageKey, essayText);
                        const now = new Date();
                        setLastSavedTime(`Đã tự động lưu lúc ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`);
                    }
                }, 5000);
                return () => clearTimeout(timeoutId);
            }, [essayText, reviewSubmission, isSubmitted, draftStorageKey]);

            useEffect(() => {
                if (!timeLimit || isSubmitted || reviewSubmission) return;
                if (timeLeft <= 0) return;
                const timerId = setInterval(() => {
                    setTimeLeft(prev => prev - 1);
                }, 1000);
                return () => clearInterval(timerId);
            }, [timeLeft, timeLimit, isSubmitted, reviewSubmission]);

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m}:${s.toString().padStart(2, '0')}`;
            };

            const handleSubmitEssay = () => {
                if (words < 15) {
                    alert("Vui lòng viết ít nhất 15 từ trước khi nộp bài.");
                    return;
                }

                if (!window.confirm("Bạn có chắc chắn muốn nộp bài viết này cho giáo viên không?")) return;

                const newWritingSub = {
                    subId: reviewSubmission ? reviewSubmission.subId : Date.now().toString(),
                    username: currentUser.username,
                    testId: test.id,
                    testTitle: test.title,
                    taskType: test.taskType || "IELTS Writing",
                    prompt: test.prompt,
                    essayText: essayText.trim(),
                    wordCount: words,
                    aiFeedback: null,
                    teacherFeedback: reviewSubmission?.teacherFeedback || '',
                    corrections: reviewSubmission?.corrections || [],
                    date: new Date().toISOString()
                };

                const existingIndex = (data.writingSubmissions || []).findIndex(s => s.subId === newWritingSub.subId);
                let updatedSubs = [...(data.writingSubmissions || [])];
                if (existingIndex >= 0) {
                    updatedSubs[existingIndex] = newWritingSub;
                } else {
                    updatedSubs.push(newWritingSub);
                }

                saveData({ ...data, writingSubmissions: updatedSubs });
                localStorage.removeItem(draftStorageKey);
                setLastSavedTime(null);
                setIsSubmitted(true);
                if (onFinish) onFinish();
                alert("Nộp bài thành công! Bài viết đã được gửi đến giáo viên và Bài mẫu tham khảo đã được mở khóa.");
            };

            const currentSub = (data.writingSubmissions || []).find(s => s.testId === test.id && s.username === currentUser.username) || reviewSubmission;
            const hasModelContent = !!(test.sampleAnswer || test.outline);

            return (
                <div className="flex flex-col md:flex-row h-full relative">
                    {!reviewSubmission && timeLimit > 0 && (
                        <div className={`fixed bottom-6 right-6 md:bottom-auto md:top-24 md:right-8 z-50 px-5 py-2.5 rounded-full font-black shadow-2xl border-2 transition-colors duration-500 flex items-center gap-2 backdrop-blur-md ${
                            isSubmitted ? 'bg-slate-800/95 text-white border-slate-700 hidden md:flex' :
                            timeLeft <= 60 ? 'bg-red-500/95 text-white border-red-400 animate-pulse' : 
                            'bg-indigo-600/95 text-white border-indigo-400'
                        }`}>
                            <span className="text-xl">⏱</span>
                            <span className="text-xl tracking-wider font-mono">{isSubmitted ? 'DONE' : formatTime(timeLeft)}</span>
                        </div>
                    )}

                    <div className="w-full md:w-1/2 h-full border-r border-slate-300 paper-bg overflow-y-auto flex flex-col shadow-[inset_-10px_0_20px_-15px_rgba(0,0,0,0.1)]">
                        <div className="bg-white/90 backdrop-blur-md px-6 py-4 border-b border-slate-200 sticky top-0 z-10 flex justify-between items-center shadow-sm">
                            <span className="text-xs font-bold uppercase tracking-widest text-indigo-600">{test.taskType || 'Writing Task'}</span>
                            <span className="font-bold text-slate-800 truncate max-w-xs">{test.title}</span>
                        </div>

                        <div className="p-8 md:p-10 space-y-6">
                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                <span className="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2">Writing Topic / Prompt</span>
                                <p className="text-slate-800 font-serif text-[1.05rem] leading-relaxed whitespace-pre-wrap">{test.prompt}</p>
                                
                                {test.imageUrl && (
                                    <div className="mt-4">
                                        <img src={test.imageUrl} alt="Writing Task Prompt Visual" className="rounded-xl border border-slate-200 max-w-full mx-auto" />
                                    </div>
                                )}

                                {test.reqs && test.reqs.length > 0 && (
                                    <div className="mt-5 pt-4 border-t border-slate-100">
                                        <span className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">Instructions</span>
                                        <ul className="list-disc ml-5 text-sm text-slate-600 space-y-1">
                                            {test.reqs.map((r, i) => <li key={i}>{r}</li>)}
                                        </ul>
                                    </div>
                                )}
                            </div>

                            <div className="space-y-6 pb-10">
                                <div className={`p-6 rounded-2xl border shadow-sm ${isSubmitted ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-amber-50 border-amber-200 text-amber-900'}`}>
                                    <h4 className="font-bold text-base mb-1 flex items-center gap-2">
                                        <span>{isSubmitted ? '✅' : '⏳'}</span>
                                        <span>{isSubmitted ? 'Đã nộp bài thành công' : 'Chưa nộp bài'}</span>
                                    </h4>
                                    <p className="text-xs opacity-90">
                                        {isSubmitted 
                                            ? 'Bài làm của bạn đã được gửi đến giáo viên. Bạn có thể tham khảo Dàn ý & Bài mẫu bên dưới trong lúc chờ nhận xét.' 
                                            : 'Hãy hoàn thành bài viết ở ô bên phải và bấm nút Nộp bài. Bài mẫu & Dàn ý sẽ tự động mở khóa ngay sau khi nộp!'}
                                    </p>
                                </div>

                                {(currentSub?.corrections && currentSub.corrections.length > 0) && (
                                    <div className="p-6 bg-white border border-rose-200 rounded-2xl shadow-sm space-y-3">
                                        <h4 className="font-bold text-rose-900 text-sm flex items-center gap-2">
                                            <span>🖍️</span> Chấm sửa chi tiết từng câu (Track Changes)
                                        </h4>
                                        <div className="space-y-3">
                                            {currentSub.corrections.map((c, idx) => (
                                                <div key={c.id || idx} className="p-3.5 rounded-xl bg-slate-50 border border-slate-200/80 text-sm space-y-1.5">
                                                    <p className="font-serif leading-relaxed">
                                                        <span className="line-through text-red-600 bg-red-100/70 px-1.5 py-0.5 rounded">{c.original}</span>
                                                        <span className="mx-2 text-slate-400 font-sans font-bold">→</span>
                                                        <span className="text-emerald-700 font-semibold bg-emerald-100/70 px-1.5 py-0.5 rounded">{c.corrected}</span>
                                                    </p>
                                                    {c.note && <p className="text-xs text-slate-600 font-sans">💡 {c.note}</p>}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {currentSub?.teacherFeedback && (
                                    <div className="p-6 bg-indigo-50 border border-indigo-200 rounded-2xl shadow-sm">
                                        <h4 className="font-bold text-indigo-900 text-sm mb-2 flex items-center gap-2">
                                            <span>👩‍🏫</span> Nhận xét từ Giáo viên
                                        </h4>
                                        <p className="text-sm text-indigo-900 whitespace-pre-wrap leading-relaxed">{currentSub.teacherFeedback}</p>
                                    </div>
                                )}

                                {hasModelContent && (
                                    isSubmitted ? (
                                        <div className="bg-white border-2 border-indigo-200 rounded-2xl overflow-hidden shadow-sm">
                                            <div className="bg-indigo-600 text-white px-6 py-3.5 flex justify-between items-center">
                                                <span className="font-bold text-sm flex items-center gap-2">
                                                    <span>🔓</span> Kho Bài Mẫu & Dàn Ý Tham Khảo (Đã mở khóa)
                                                </span>
                                                <button
                                                    onClick={() => setShowModelTab(!showModelTab)}
                                                    className="text-xs bg-white/20 hover:bg-white/30 px-3 py-1 rounded-full font-bold transition"
                                                >
                                                    {showModelTab ? 'Thu gọn ▲' : 'Xem chi tiết ▼'}
                                                </button>
                                            </div>
                                            {showModelTab && (
                                                <div className="p-6 space-y-5">
                                                    {test.outline && (
                                                        <div className="bg-amber-50/70 p-4 rounded-xl border border-amber-200">
                                                            <h5 className="text-xs font-bold uppercase tracking-wider text-amber-900 mb-2">📌 Dàn ý gợi ý (Suggested Outline)</h5>
                                                            <p className="text-sm text-slate-700 whitespace-pre-wrap leading-relaxed">{test.outline}</p>
                                                        </div>
                                                    )}
                                                    {test.sampleAnswer && (
                                                        <div>
                                                            <h5 className="text-xs font-bold uppercase tracking-wider text-indigo-700 mb-2">✨ Bài mẫu tham khảo (Band 8.0+ Model Essay)</h5>
                                                            <div className="bg-[#FDFBF7] p-5 rounded-xl border border-slate-200 font-serif text-[15px] text-slate-800 leading-relaxed whitespace-pre-wrap">
                                                                {test.sampleAnswer}
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    ) : (
                                        <div className="bg-slate-100 border border-slate-200 p-5 rounded-2xl flex items-center gap-3 text-slate-500">
                                            <span className="text-2xl">🔒</span>
                                            <div>
                                                <p className="text-sm font-bold text-slate-700">Dàn ý & Bài mẫu tham khảo đang khóa</p>
                                                <p className="text-xs">Hoàn thành và nộp bài viết để mở khóa bài mẫu đối chiếu.</p>
                                            </div>
                                        </div>
                                    )
                                )}
                            </div>
                        </div>
                    </div>

                    <div className="w-full md:w-1/2 h-full bg-slate-50 flex flex-col p-6 md:p-10">
                        <div className="bg-white px-5 py-3.5 rounded-t-2xl border border-b-0 border-slate-200 flex flex-wrap justify-between items-center gap-2 shadow-sm">
                            <div className="flex items-center gap-3">
                                <span className="text-xs font-bold uppercase tracking-wider text-slate-400">Word Count:</span>
                                <span className={`text-base font-black px-3 py-0.5 rounded-full border ${
                                    words >= minWords 
                                        ? 'bg-emerald-50 text-emerald-700 border-emerald-200' 
                                        : 'bg-amber-50 text-amber-700 border-amber-200'
                                }`}>
                                    {words} <span className="font-normal text-xs opacity-80">/ {minWords} min</span>
                                </span>
                            </div>
                            <div className="flex items-center gap-3">
                                {lastSavedTime && !isSubmitted && (
                                    <span className="text-[11px] font-semibold text-emerald-600 bg-emerald-50 px-2.5 py-0.5 rounded-full">
                                        💾 {lastSavedTime}
                                    </span>
                                )}
                                <span className="text-xs text-slate-400 font-medium">
                                    {words >= minWords ? '✓ Target length reached' : `Need ${minWords - words} more words`}
                                </span>
                            </div>
                        </div>

                        <textarea
                            className="w-full flex-1 p-6 border border-slate-200 rounded-b-2xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none font-serif text-[1.05rem] leading-loose text-slate-800 bg-white shadow-inner resize-none"
                            placeholder="Write your essay response here... (Bài viết tự động lưu nháp mỗi 5 giây)"
                            value={essayText}
                            onChange={e => setEssayText(e.target.value)}
                            disabled={isSubmitted && reviewSubmission}
                        ></textarea>

                        {!reviewSubmission && (
                            <div className="mt-5 flex gap-3">
                                {isSubmitted ? (
                                    <button
                                        onClick={() => setIsSubmitted(false)}
                                        className="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 py-4 px-8 rounded-2xl font-bold transition-all text-base"
                                    >
                                        ✏️ Sửa lại bài viết
                                    </button>
                                ) : null}
                                <button
                                    onClick={handleSubmitEssay}
                                    className="flex-1 py-4 px-8 rounded-2xl font-bold text-white shadow-lg transition-all text-base bg-indigo-600 hover:bg-indigo-700 hover:shadow-xl transform hover:-translate-y-0.5 flex items-center justify-center gap-2"
                                >
                                    <span>📤</span>
                                    <span>{isSubmitted ? 'Cập nhật bài nộp' : 'Nộp bài cho giáo viên'}</span>
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ==========================================
        // READING TEST INTERFACE
        // ==========================================
        function StudentTest({ test, currentUser, data, saveData, reviewSubmission, timeLimit, onFinish, savedVocab = [], onSaveVocab }) {
            const [answers, setAnswers] = useState({});
            const [locked, setLocked] = useState({});
            const [submitted, setSubmitted] = useState(!!reviewSubmission);
            const [score, setScore] = useState(reviewSubmission ? reviewSubmission.score : 0);
            const [writingAnswer, setWritingAnswer] = useState(reviewSubmission ? (reviewSubmission.writingAnswer || '') : '');
            
            const [activeWordIndex, setActiveWordIndex] = useState(null); 
            const [highlightToolbar, setHighlightToolbar] = useState(null);
            const [highlightCount, setHighlightCount] = useState(0);
            const passageContainerRef = useRef(null);

            const [notesOpen, setNotesOpen] = useState(false);
            const [notesText, setNotesText] = useState(() => {
                return localStorage.getItem(`reading_notes_${currentUser.username}_${test.id}`) || '';
            });
            
            const initialTime = timeLimit ? timeLimit * 60 : 0;
            const [timeLeft, setTimeLeft] = useState(initialTime);

            const maxScore = test.mcq.length + (test.fib?.length || 0);

            useEffect(() => {
                localStorage.setItem(`reading_notes_${currentUser.username}_${test.id}`, notesText);
            }, [notesText, currentUser.username, test.id]);

            useEffect(() => {
                if (reviewSubmission) {
                    const loadedAnswers = {};
                    const loadedLocked = {};
                    test.mcq.forEach((q, i) => { loadedAnswers[`mcq_${i}`] = q.a; loadedLocked[`mcq_${i}`] = true; });
                    if(test.fib) test.fib.forEach((q, i) => { loadedAnswers[`fib_${i}`] = q.a.toLowerCase(); loadedLocked[`fib_${i}`] = true; });
                    setAnswers(loadedAnswers);
                    setLocked(loadedLocked);
                }
            }, [reviewSubmission, test]);

            useEffect(() => {
                if (!timeLimit || submitted || reviewSubmission) return;
                
                if (timeLeft <= 0) {
                    submitTest();
                    return;
                }
                
                const timerId = setInterval(() => {
                    setTimeLeft(prev => prev - 1);
                }, 1000);
                
                return () => clearInterval(timerId);
            }, [timeLeft, timeLimit, submitted, reviewSubmission]);

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m}:${s.toString().padStart(2, '0')}`;
            };

            const handleMCQ = (qIndex, optionLetter) => {
                if (locked[`mcq_${qIndex}`]) return;
                setAnswers(prev => ({ ...prev, [`mcq_${qIndex}`]: optionLetter }));
            };

            const handleFIB = (qIndex, word) => {
                if (locked[`fib_${qIndex}`]) return;
                setAnswers(prev => ({ ...prev, [`fib_${qIndex}`]: word.toLowerCase().trim() }));
            };

            const submitTest = () => {
                let current = 0; let newLocked = { ...locked };
                test.mcq.forEach((q, i) => { if (answers[`mcq_${i}`] === q.a) { current++; newLocked[`mcq_${i}`] = true; } });
                if(test.fib) test.fib.forEach((q, i) => { if (answers[`fib_${i}`] === q.a.toLowerCase()) { current++; newLocked[`fib_${i}`] = true; } });

                setScore(current); setLocked(newLocked); setSubmitted(true);
                if (onFinish) onFinish(); 
                
                const newSub = { 
                    subId: Date.now().toString(), username: currentUser.username, testId: test.id, 
                    testTitle: test.title, score: current, date: new Date().toISOString(),
                    writingAnswer: test.writingTask ? writingAnswer.trim() : null
                };
                saveData({ ...data, scores: [...data.scores, newSub] });
            };

            const retryIncorrect = () => {
                setSubmitted(false);
                const kept = {};
                Object.keys(answers).forEach(k => { if (locked[k]) kept[k] = answers[k]; });
                setAnswers(kept);
            };

            const isWordSaved = (w) => savedVocab.some(item => item.w.toLowerCase() === w.toLowerCase());

            const handlePassageMouseUp = () => {
                const selection = window.getSelection();
                if (!selection || selection.isCollapsed || !selection.toString().trim()) {
                    setHighlightToolbar(null);
                    return;
                }

                const range = selection.getRangeAt(0);
                if (passageContainerRef.current && passageContainerRef.current.contains(range.commonAncestorContainer)) {
                    const rect = range.getBoundingClientRect();
                    setHighlightToolbar({
                        x: rect.left + rect.width / 2,
                        y: Math.max(10, rect.top - 48)
                    });
                } else {
                    setHighlightToolbar(null);
                }
            };

            const applyYellowHighlight = () => {
                const selection = window.getSelection();
                if (!selection || selection.isCollapsed) return;

                const range = selection.getRangeAt(0);
                const mark = document.createElement('mark');
                mark.className = 'user-highlight';
                mark.title = 'Click vào vùng tô vàng để xóa highlight';
                mark.onclick = (e) => {
                    e.stopPropagation();
                    const parent = mark.parentNode;
                    while (mark.firstChild) {
                        parent.insertBefore(mark.firstChild, mark);
                    }
                    parent.removeChild(mark);
                    parent.normalize();
                    setHighlightCount(prev => Math.max(0, prev - 1));
                };

                try {
                    range.surroundContents(mark);
                    setHighlightCount(prev => prev + 1);
                } catch (e) {
                    const fragment = range.extractContents();
                    mark.appendChild(fragment);
                    range.insertNode(mark);
                    setHighlightCount(prev => prev + 1);
                }

                selection.removeAllRanges();
                setHighlightToolbar(null);
            };

            const clearAllHighlights = () => {
                if (!passageContainerRef.current) return;
                const marks = passageContainerRef.current.querySelectorAll('mark.user-highlight');
                marks.forEach(mark => {
                    const parent = mark.parentNode;
                    while (mark.firstChild) {
                        parent.insertBefore(mark.firstChild, mark);
                    }
                    parent.removeChild(mark);
                    parent.normalize();
                });
                setHighlightCount(0);
                setHighlightToolbar(null);
            };

            const renderInteractivePassage = () => {
                if (!test.vocab || test.vocab.length === 0) return test.passage;

                const sortedVocab = [...test.vocab].sort((a, b) => b.w.length - a.w.length);
                const escapeRegExp = (string) => string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const vocabWords = sortedVocab.map(v => escapeRegExp(v.w));
                
                const regex = new RegExp(`\\b(${vocabWords.join('|')})\\b`, 'gi');
                const parts = test.passage.split(regex);

                return parts.map((part, i) => {
                    const matchedVocab = test.vocab.find(v => v.w.toLowerCase() === part.toLowerCase());
                    if (matchedVocab) {
                        const alreadySaved = isWordSaved(matchedVocab.w);
                        return (
                            <span 
                                key={i} 
                                onClick={() => setActiveWordIndex(activeWordIndex === i ? null : i)}
                                className="relative inline-block border-b-2 border-dotted border-indigo-400 hover:bg-indigo-100/70 text-indigo-900 cursor-pointer font-medium px-0.5 rounded transition-colors"
                                title="Click to see meaning, pronounce & save"
                            >
                                {part}
                                {activeWordIndex === i && (
                                    <span 
                                        onClick={e => e.stopPropagation()}
                                        className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 w-64 bg-slate-900 text-white text-xs p-3 rounded-xl shadow-2xl z-50 text-left font-sans font-normal leading-normal before:content-[''] before:absolute before:top-full before:left-1/2 before:-translate-x-1/2 before:border-4 before:border-transparent before:border-t-slate-900"
                                    >
                                        <span className="flex items-center justify-between border-b border-slate-700 pb-1.5 mb-1.5">
                                            <span className="font-bold text-indigo-300 text-sm">{matchedVocab.w}</span>
                                            <button
                                                type="button"
                                                onClick={(e) => speakWord(matchedVocab.w, e)}
                                                className="bg-slate-800 hover:bg-slate-700 px-2 py-0.5 rounded text-xs"
                                                title="Nghe phát âm"
                                            >
                                                🔊
                                            </button>
                                        </span>
                                        <span className="block text-slate-200 mb-2.5">{matchedVocab.m}</span>
                                        <button
                                            type="button"
                                            onClick={() => onSaveVocab && onSaveVocab(matchedVocab, test.title)}
                                            disabled={alreadySaved}
                                            className={`w-full py-1.5 rounded-lg font-bold text-center text-[11px] transition ${
                                                alreadySaved 
                                                    ? 'bg-emerald-600/30 text-emerald-300 cursor-default' 
                                                    : 'bg-indigo-600 hover:bg-indigo-500 text-white'
                                            }`}
                                        >
                                            {alreadySaved ? '✓ Đã lưu trong sổ tay' : '+ Lưu vào sổ tay'}
                                        </button>
                                    </span>
                                )}
                            </span>
                        );
                    }
                    return <span key={i}>{part}</span>;
                });
            };

            return (
                <div className="flex flex-col md:flex-row h-full relative">
                    {highlightToolbar && (
                        <div 
                            style={{ left: `${highlightToolbar.x}px`, top: `${highlightToolbar.y}px` }}
                            className="fixed -translate-x-1/2 z-50 bg-slate-900 text-white px-3 py-1.5 rounded-full shadow-xl flex items-center gap-2 border border-slate-700"
                        >
                            <button
                                onMouseDown={(e) => { e.preventDefault(); applyYellowHighlight(); }}
                                className="flex items-center gap-1.5 text-xs font-bold text-yellow-300 hover:text-yellow-200 transition"
                            >
                                <span className="w-3.5 h-3.5 rounded-full bg-yellow-300 inline-block"></span>
                                Highlight
                            </button>
                        </div>
                    )}

                    <div className="fixed bottom-5 left-5 z-40">
                        {notesOpen ? (
                            <div className="bg-amber-50 border-2 border-amber-300 rounded-2xl shadow-2xl w-80 overflow-hidden">
                                <div className="bg-amber-200/80 px-4 py-2.5 flex justify-between items-center">
                                    <span className="text-xs font-bold text-amber-950 flex items-center gap-1.5">
                                        <span>📝</span> Scratchpad / Ghi chú nhanh
                                    </span>
                                    <button onClick={() => setNotesOpen(false)} className="text-xs font-bold text-amber-900 hover:bg-amber-300/60 px-2 py-0.5 rounded">
                                        Thu gọn ▾
                                    </button>
                                </div>
                                <textarea
                                    className="w-full h-44 p-3.5 bg-amber-50/50 text-xs text-slate-800 outline-none resize-none leading-relaxed"
                                    placeholder="Nháp ý chính từng đoạn (Paragraph A, B, C...) hoặc từ khóa câu hỏi..."
                                    value={notesText}
                                    onChange={e => setNotesText(e.target.value)}
                                ></textarea>
                            </div>
                        ) : (
                            <button
                                onClick={() => setNotesOpen(true)}
                                className="bg-amber-400 hover:bg-amber-300 text-amber-950 font-bold px-4 py-2.5 rounded-full shadow-xl border border-amber-500/40 text-xs flex items-center gap-2 transition transform hover:scale-105"
                            >
                                <span>📝</span> Notes {notesText.trim() ? '•' : ''}
                            </button>
                        )}
                    </div>

                    {!reviewSubmission && timeLimit > 0 && (
                        <div className={`fixed bottom-6 right-6 md:bottom-auto md:top-24 md:right-8 z-50 px-5 py-2.5 rounded-full font-black shadow-2xl border-2 transition-colors duration-500 flex items-center gap-2 backdrop-blur-md ${
                            submitted ? 'bg-slate-800/95 text-white border-slate-700 hidden md:flex' :
                            timeLeft <= 60 ? 'bg-red-500/95 text-white border-red-400 animate-pulse' : 
                            'bg-indigo-600/95 text-white border-indigo-400'
                        }`}>
                            <span className="text-xl">⏱</span>
                            <span className="text-xl tracking-wider font-mono">{submitted ? 'DONE' : formatTime(timeLeft)}</span>
                        </div>
                    )}

                    {/* LEFT PANEL: READING */}
                    <div className="w-full md:w-1/2 h-full border-r border-slate-300 paper-bg overflow-y-auto flex flex-col shadow-[inset_-10px_0_20px_-15px_rgba(0,0,0,0.1)]">
                        <div className="bg-white/90 backdrop-blur-md px-6 py-4 border-b border-slate-200 sticky top-0 z-10 flex justify-between items-center shadow-sm gap-2">
                            <div className="flex items-center gap-2 min-w-0">
                                <span className="text-xs font-bold uppercase tracking-widest text-slate-400 flex-shrink-0">Section I</span>
                                <span className="font-bold text-slate-800 truncate">{test.title.split(': ').pop()}</span>
                            </div>
                            <div className="flex items-center gap-2 flex-shrink-0">
                                <span className="hidden lg:inline-block text-[11px] text-slate-400 bg-slate-100 px-2.5 py-1 rounded-full">
                                    🖍 Bôi đen để Highlight
                                </span>
                                {highlightCount > 0 && (
                                    <button 
                                        onClick={clearAllHighlights}
                                        className="text-xs bg-yellow-100 hover:bg-yellow-200 text-amber-900 border border-yellow-300 font-bold px-2.5 py-1 rounded-full transition"
                                    >
                                        Xóa Highlight ({highlightCount})
                                    </button>
                                )}
                            </div>
                        </div>
                        
                        <div 
                            ref={passageContainerRef}
                            onMouseUp={handlePassageMouseUp}
                            className="p-8 md:p-12 text-[1.1rem] leading-[2.2rem] text-slate-800 font-serif whitespace-pre-wrap selection:bg-yellow-200 pb-24"
                        >
                            {renderInteractivePassage()}

                            {test.vocab && test.vocab.length > 0 && (
                                <div className="mt-12 bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden font-sans text-base leading-normal">
                                    <div className="bg-slate-50 px-6 py-3 border-b border-slate-200 font-bold text-slate-700 text-sm uppercase tracking-wider flex justify-between items-center">
                                        <span>Glossary Summary</span>
                                        <span className="text-[11px] font-normal text-slate-400 normal-case">Bấm 🔊 để nghe • Lưu từ để học Flashcards</span>
                                    </div>
                                    <div className="p-6 grid gap-3">
                                        {test.vocab.map((v, i) => {
                                            const alreadySaved = isWordSaved(v.w);
                                            return (
                                                <div key={i} className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 last:border-0 pb-3 last:pb-0">
                                                    <div className="flex flex-col sm:flex-row sm:items-baseline gap-1 sm:gap-3 flex-1">
                                                        <div className="flex items-center gap-2 sm:w-2/5">
                                                            <span className="font-bold text-indigo-800">{v.w}</span>
                                                            <button
                                                                type="button"
                                                                onClick={(e) => speakWord(v.w, e)}
                                                                className="text-sm hover:scale-110 transition"
                                                                title="Nghe phát âm"
                                                            >
                                                                🔊
                                                            </button>
                                                        </div>
                                                        <span className="text-slate-600 text-sm sm:w-3/5">{v.m}</span>
                                                    </div>
                                                    <button
                                                        type="button"
                                                        onClick={() => onSaveVocab && onSaveVocab(v, test.title)}
                                                        disabled={alreadySaved}
                                                        className={`text-xs font-bold px-3 py-1 rounded-lg transition self-start sm:self-center flex-shrink-0 ${
                                                            alreadySaved
                                                                ? 'bg-emerald-50 text-emerald-600 border border-emerald-200'
                                                                : 'bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200'
                                                        }`}
                                                    >
                                                        {alreadySaved ? '✓ Đã lưu' : '+ Lưu vào sổ tay'}
                                                    </button>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* RIGHT PANEL: QUESTIONS */}
                    <div className="w-full md:w-1/2 h-full bg-slate-50 overflow-y-auto p-6 md:p-10 relative pb-32">
                        
                        {submitted && (
                            <div className="mb-8 bg-white border border-indigo-100 p-6 rounded-2xl shadow-lg flex justify-between items-center sticky top-0 z-20 overflow-hidden relative">
                                <div className="absolute top-0 left-0 w-2 h-full bg-indigo-500"></div>
                                <div>
                                    <p className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Final Score</p>
                                    <h2 className="text-3xl font-black text-slate-800">{score} <span className="text-xl text-slate-400 font-medium">/ {maxScore}</span></h2>
                                </div>
                                {(score < maxScore && !reviewSubmission) && (
                                    <button onClick={retryIncorrect} className="bg-slate-900 hover:bg-indigo-600 text-white font-bold py-3 px-6 rounded-xl shadow-md transition-colors duration-300">
                                        Retry Errors ↺
                                    </button>
                                )}
                            </div>
                        )}

                        {test.mcq && test.mcq.length > 0 && (
                            <div className="mb-12">
                                <h3 className="font-bold text-lg mb-6 text-slate-800 border-b border-slate-200 pb-2">Part 1: Multiple Choice</h3>
                                <div className="space-y-6">
                                    {test.mcq.map((q, i) => {
                                        const isLocked = locked[`mcq_${i}`];
                                        const isWrong = submitted && !isLocked;
                                        return (
                                            <div key={i} className={`p-6 rounded-2xl border ${isLocked ? 'bg-emerald-50/50 border-emerald-200' : isWrong ? 'bg-red-50/50 border-red-200' : 'bg-white border-slate-200 shadow-sm'}`}>
                                                <p className="font-bold text-slate-800 mb-4">{q.q}</p>
                                                <div className="space-y-2">
                                                    {q.options.map((opt, oIdx) => {
                                                        const letter = opt.charAt(0);
                                                        const isSelected = answers[`mcq_${i}`] === letter;
                                                        return (
                                                            <label 
                                                                key={oIdx} 
                                                                className={`flex items-center p-3 rounded-xl border cursor-pointer transition-all ${isSelected ? 'bg-indigo-50 border-indigo-300 shadow-[inset_0_0_0_1px_rgba(165,180,252,1)]' : 'hover:bg-slate-50 border-slate-100'} ${isLocked ? 'opacity-70 pointer-events-none' : ''}`}
                                                            >
                                                                <input 
                                                                    type="radio" 
                                                                    name={`mcq_${i}`} 
                                                                    className="hidden" 
                                                                    disabled={isLocked} 
                                                                    checked={isSelected} 
                                                                    onChange={() => handleMCQ(i, letter)} 
                                                                />
                                                                <div className={`w-5 h-5 rounded-full border flex items-center justify-center mr-4 flex-shrink-0 ${isSelected ? 'border-indigo-600' : 'border-slate-300'}`}>
                                                                    {isSelected && <div className="w-2.5 h-2.5 bg-indigo-600 rounded-full"></div>}
                                                                </div>
                                                                <span className={isSelected ? 'text-indigo-900 font-medium' : 'text-slate-600'}>{opt}</span>
                                                            </label>
                                                        )
                                                    })}
                                                </div>
                                                {isLocked && <div className="mt-4 flex items-center gap-1 text-emerald-600 text-sm font-bold">✓ Correct</div>}
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        )}

                        {test.fib && test.fib.length > 0 && (
                            <div className="mb-12">
                                <h3 className="font-bold text-lg mb-6 text-slate-800 border-b border-slate-200 pb-2">Part 2: Fill in the Blanks</h3>
                                
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 mb-8 sticky top-2 z-10">
                                    <p className="text-xs font-bold text-slate-400 mb-3 uppercase tracking-wider">Word Bank</p>
                                    <div className="flex flex-wrap gap-2">
                                        {test.wordBank.map((word, i) => {
                                            const isUsed = Object.values(answers).includes(word.toLowerCase());
                                            return (
                                                <span key={i} className={`px-3 py-1.5 rounded-lg text-sm font-medium border ${isUsed ? 'bg-slate-100 text-slate-400 border-transparent line-through' : 'bg-white text-indigo-700 border-indigo-200 shadow-sm'}`}>
                                                    {word}
                                                </span>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    {test.fib.map((q, i) => {
                                        const isLocked = locked[`fib_${i}`];
                                        const isWrong = submitted && !isLocked;
                                        return (
                                            <div key={i} className={`p-5 rounded-xl border flex flex-col xl:flex-row xl:items-center gap-4 ${isLocked ? 'bg-emerald-50/50 border-emerald-200' : isWrong ? 'bg-red-50/50 border-red-200' : 'bg-white border-slate-200 shadow-sm'}`}>
                                                <p className="flex-1 font-medium text-slate-800">{q.q}</p>
                                                <div className="flex flex-col items-start xl:items-end flex-shrink-0">
                                                    <input type="text" placeholder="Type here..." disabled={isLocked} value={answers[`fib_${i}`] || ''} onChange={(e) => handleFIB(i, e.target.value)}
                                                        className={`border-b-2 border-slate-300 bg-transparent py-2 px-1 w-40 text-center font-bold outline-none focus:border-indigo-500 transition-colors ${isLocked ? 'text-emerald-700 border-emerald-300' : 'text-slate-800'}`} />
                                                    {isLocked && <span className="text-emerald-600 text-xs font-bold mt-2">✓ Locked</span>}
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        )}

                        {test.writingTask && (
                            <div className="mb-12">
                                <h3 className="font-bold text-lg mb-6 text-slate-800 border-b border-slate-200 pb-2">Part 3: Written Response</h3>
                                <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-1 h-full bg-slate-800"></div>
                                    <p className="font-medium text-slate-800 whitespace-pre-wrap leading-relaxed mb-6">{test.writingTask.prompt}</p>
                                    
                                    {test.writingTask.reqs && (
                                        <div className="mb-6 p-4 bg-slate-50 border border-slate-100 rounded-xl">
                                            <span className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">Requirements</span>
                                            <ul className="list-disc ml-5 text-sm text-slate-600 space-y-1">
                                                {test.writingTask.reqs.map(r => <li key={r}>{r}</li>)}
                                            </ul>
                                        </div>
                                    )}

                                    <textarea 
                                        className={`w-full p-5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none font-serif leading-loose text-slate-800 bg-slate-50 shadow-inner resize-y min-h-[200px] ${submitted ? 'opacity-80 pointer-events-none' : ''}`}
                                        placeholder="Begin your response here..."
                                        value={writingAnswer}
                                        onChange={e => setWritingAnswer(e.target.value)}
                                        disabled={submitted}
                                    />

                                    {reviewSubmission?.feedback && (
                                        <div className="mt-8 p-6 bg-indigo-50 border border-indigo-100 rounded-xl">
                                            <div className="flex items-center gap-2 mb-3">
                                                <div className="w-8 h-8 rounded-full bg-indigo-200 flex items-center justify-center text-indigo-700 text-lg">👩‍🏫</div>
                                                <h4 className="font-bold text-indigo-900 tracking-tight">Instructor's Feedback</h4>
                                            </div>
                                            <p className="text-indigo-900/80 whitespace-pre-wrap leading-relaxed text-sm ml-10">{reviewSubmission.feedback}</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {!submitted && (
                            <button onClick={submitTest} className="w-full bg-slate-900 hover:bg-indigo-600 text-white font-bold py-5 rounded-2xl shadow-lg hover:shadow-xl transition-all duration-300 text-lg transform hover:-translate-y-1">
                                Submit Assessment
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
